# Ruff configuration for TRR-Backend
# https://docs.astral.sh/ruff/configuration/

# Exclude common paths from linting
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
]

# Target Python 3.11+
target-version = "py311"

# Line length
line-length = 120

[lint]
# Enable recommended rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# Ignore specific rules if needed
ignore = [
    "B008",  # Allow function calls in argument defaults (required for FastAPI Depends/Query)
]

[format]
# Use double quotes
quote-style = "double"

# Indent with 4 spaces
indent-style = "space"
