name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Unresolved merge markers detected. Resolve conflicts before merge." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Validate env contract
        run: |
          python scripts/check_env_example.py \
            --file .env.example \
            --required SCREENALYTICS_API_URL TRR_INTERNAL_ADMIN_SHARED_SECRET SCREENALYTICS_SERVICE_TOKEN \
            --allow-hyphen GEMINI-MODEL

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.27"

      - name: Verify requirements lock freshness
        run: |
          cp requirements.lock.txt /tmp/requirements.lock.before.txt
          uv pip compile requirements.in --python-version 3.11 -o requirements.lock.txt
          diff -u /tmp/requirements.lock.before.txt requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import gate
        run: python -c "import api.main"

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Run tests
        run: python -m pytest

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.70.5

      - name: Start Supabase
        run: |
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --yes

      - name: Schema docs check
        run: make schema-docs-check

  test-py312-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate env contract
        run: |
          python scripts/check_env_example.py \
            --file .env.example \
            --required SCREENALYTICS_API_URL TRR_INTERNAL_ADMIN_SHARED_SECRET SCREENALYTICS_SERVICE_TOKEN \
            --allow-hyphen GEMINI-MODEL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import gate
        run: python -c "import api.main"

      - name: Run API smoke subset
        run: python -m pytest tests/api -q
