# Mirror media assets to S3 using content-addressed keys
#
# This workflow mirrors pending/failed assets from core.media_assets to S3.
# Conservative defaults to avoid rate limiting from external image sources.
#
# Manual dispatch is preferred; schedule is commented out by default.

name: Mirror Media Assets to S3

on:
  # Schedule is optional - uncomment if you want automated runs
  # schedule:
  #   - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max assets to mirror (keep small: 100-200)'
        default: '100'
        type: string
      status:
        description: 'Asset status to process'
        default: 'pending'
        type: choice
        options:
          - pending
          - failed

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror media assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_CDN_BASE_URL: ${{ secrets.AWS_CDN_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          PYTHONPATH=. python scripts/mirror_media_assets_to_s3.py \
            --status ${{ inputs.status || 'pending' }} \
            --limit ${{ inputs.limit || '100' }} \
            --verbose
